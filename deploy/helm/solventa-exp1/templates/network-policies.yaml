{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "solventa-exp1.fullname" . }}-default-deny-ingress
  labels:
    {{- include "solventa-exp1.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "solventa-exp1.fullname" . }}-quotation-ingress
  labels:
    {{- include "solventa-exp1.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "solventa-exp1.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: quotation
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.quotationIngressCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "solventa-exp1.fullname" . }}-profile-ingress
  labels:
    {{- include "solventa-exp1.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "solventa-exp1.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: profile
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "solventa-exp1.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: quotation
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "solventa-exp1.fullname" . }}-wiremock-ingress
  labels:
    {{- include "solventa-exp1.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "solventa-exp1.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: wiremock
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "solventa-exp1.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: profile
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
